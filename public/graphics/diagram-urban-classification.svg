<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-urban" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0A1128"/>
    </linearGradient>
    <pattern id="grid-dots-urban" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="rgba(255,255,255,0.07)"/>
    </pattern>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#bg-grad-urban)"/>
  <rect width="960" height="480" rx="16" fill="url(#grid-dots-urban)"/>
  <rect x="25" y="25" width="910" height="430" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Header -->
  <text x="50" y="65" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8" letter-spacing="2" font-weight="700">ARCHITECTURE AI LAB // SYSTEMS &bull; WORK</text>
  <text x="50" y="85" font-family="'Inter', sans-serif" font-size="16" fill="#FFFFFF" font-weight="800">Sistema Algorítmico de Clasificación Espacial para Tejidos Urbanos</text>
  <text x="910" y="65" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7DD3FC">SPACE SYNTAX + GRAPH ML</text>

  <!-- Left: Geometric Urban Axial Graph Representation -->
  <g transform="translate(60, 120)">
    <rect width="400" height="310" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8" font-weight="700">TOPOLOGICAL AXIAL GRAPH</text>

    <!-- Axial lines network representing streets -->
    <line x1="40" y1="80" x2="360" y2="80" stroke="#0284C7" stroke-width="2.5" opacity="0.6"/>
    <line x1="40" y1="140" x2="360" y2="170" stroke="#38BDF8" stroke-width="3"/>
    <line x1="60" y1="220" x2="340" y2="210" stroke="#0284C7" stroke-width="2" opacity="0.5"/>
    <line x1="50" y1="270" x2="350" y2="260" stroke="#38BDF8" stroke-width="2.5"/>

    <!-- Intersecting transversal axes -->
    <line x1="90" y1="50" x2="110" y2="290" stroke="#38BDF8" stroke-width="2.5"/>
    <line x1="200" y1="60" x2="190" y2="290" stroke="#F43F5E" stroke-width="3.5"/> <!-- High integration core -->
    <line x1="290" y1="50" x2="310" y2="290" stroke="#38BDF8" stroke-width="2.5"/>
    
    <!-- Graph nodes -->
    <circle cx="195" cy="148" r="9" fill="#F43F5E" stroke="#FFF" stroke-width="2"/>
    <circle cx="95" cy="80" r="6" fill="#38BDF8" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="198" cy="80" r="7" fill="#F43F5E" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="295" cy="80" r="6" fill="#38BDF8" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="103" cy="145" r="6" fill="#38BDF8" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="303" cy="165" r="6" fill="#38BDF8" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="108" cy="215" r="6" fill="#38BDF8" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="193" cy="212" r="7" fill="#F43F5E" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="308" cy="212" r="6" fill="#38BDF8" stroke="#FFF" stroke-width="1.5"/>

    <!-- Label -->
    <text x="215" y="145" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FFF" font-weight="700">MAX INTEGRATION (Node #42)</text>
  </g>

  <!-- Right: ML Latent Space Classifier -->
  <g transform="translate(490, 120)">
    <rect width="410" height="310" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(244, 63, 94, 0.25)" stroke-width="1"/>
    <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F43F5E" font-weight="700">GNN MORPHOLOGICAL EMBEDDING</text>

    <!-- Cluster scatter representation -->
    <circle cx="120" cy="110" r="38" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-dasharray="3 3"/>
    <text x="120" y="114" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#7DD3FC">Consolidado</text>

    <circle cx="270" cy="100" r="44" fill="rgba(244, 63, 94, 0.15)" stroke="#F43F5E" stroke-dasharray="3 3"/>
    <text x="270" y="104" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#FDA4AF">Alta Densidad</text>

    <circle cx="200" cy="220" r="42" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-dasharray="3 3"/>
    <text x="200" y="224" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#6EE7B7">Periurbano</text>

    <line x1="120" y1="110" x2="270" y2="100" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="270" y1="100" x2="200" y2="220" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="200" y1="220" x2="120" y2="110" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

    <text x="20" y="285" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">&bull; Integración multiescala de grafos urbanos para diagnósticos predictivos.</text>
  </g>
</svg>
